# Copy to config.yaml and edit. config.yaml is tracked — keep secrets out of
# it; telegram creds belong in .env (repo root, gitignored), see .env.example.

db_path: ../data/listings.db

# Min score (0-10) for a listing to trigger a notification.
notify_threshold: 7

# Max LLM evaluations per run (cost control)
llm_max_per_run: 40

# LLM backend:
#   "cli"    — `claude -p` (Max subscription, free at point of use; needs claude CLI)
#   "api"    — anthropic SDK (ANTHROPIC_API_KEY)
#   "openai" — any OpenAI-compatible /chat/completions endpoint:
#              OpenCode Zen, LiteLLM proxy, OpenRouter, Ollama, ...
#              Needs llm_base_url + LLM_API_KEY env var.
# Env vars LLM_BACKEND / LLM_MODEL / LLM_BASE_URL override these, so this
# tracked file stays host-neutral (Mac runs cli, Docker injects openai).
llm_backend: cli
llm_model: claude-sonnet-4-6
# llm_base_url: https://opencode.ai/zen/v1   # for llm_backend: openai (Zen model ids: glm-5.1, kimi-k2.5, deepseek-v4-pro, ...)

# Minutes between runs in --loop mode (long-running Docker container).
# Env var RUN_INTERVAL_MINUTES overrides.
run_interval_minutes: 30

# Search configurations. Each scraper gets one or more searches.
scrapers:
  kleinanzeigen:
    enabled: true
    searches:
      - city: Heidelberg
        radius_km: 20
        max_pages: 3
        min_price: 200000
        max_price: 800000

  immoscout24:
    enabled: true  # uses the mobile-app API (api.mobile.immobilienscout24.de) - no captcha, stdlib only
    searches:
      - lat: 49.3988      # Heidelberg Bismarckplatz
        lon: 8.6724
        radius_km: 20
        max_price: 800000
        min_sqm: 100
        max_pages: 3

  immowelt:
    # DISABLED: Immowelt is behind DataDome captcha on both web and API.
    # No clean scrape path. Needs undetected-chromedriver + cookie solving.
    # Low priority - inventory overlaps heavily with Immoscout24.
    enabled: false
    searches:
      - immowelt_location_code: AD08DE6325
        max_price: 800000
        min_sqm: 100
        max_pages: 2

  rss:
    enabled: false
    searches:
      - feeds:
          # Paste your Immoscout Sparalarm RSS URL here after enabling RSS export in your saved search
          - url: https://www.immobilienscout24.de/Suche/Rss?searchID=PASTE_ID_HERE
            label: is24_sparalarm
