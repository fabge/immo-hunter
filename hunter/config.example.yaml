# Copy to config.yaml and edit. config.yaml is gitignored.

db_path: ../data/listings.db

# Min score (0-10) for a listing to trigger a notification.
notify_threshold: 7

# Max LLM evaluations per run (cost control)
llm_max_per_run: 40

# LLM backend: "cli" uses `claude -p` (Max subscription, free at point of use),
# "api" uses anthropic SDK (requires valid ANTHROPIC_API_KEY billed separately)
llm_backend: cli
llm_model: claude-sonnet-4-6

telegram:
  # Either set these or use env vars TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
  bot_token: null
  chat_id: null

# Search configurations. Each scraper gets one or more searches.
scrapers:
  kleinanzeigen:
    enabled: true
    searches:
      - city: Heidelberg
        radius_km: 20
        max_pages: 3
        min_price: 200000
        max_price: 800000

  immoscout24:
    enabled: true  # uses the mobile-app API (api.mobile.immobilienscout24.de) - no captcha, stdlib only
    searches:
      - lat: 49.3988      # Heidelberg Bismarckplatz
        lon: 8.6724
        radius_km: 20
        max_price: 800000
        min_sqm: 100
        max_pages: 3

  immowelt:
    # DISABLED: Immowelt is behind DataDome captcha on both web and API.
    # No clean scrape path. Needs undetected-chromedriver + cookie solving.
    # Low priority - inventory overlaps heavily with Immoscout24.
    enabled: false
    searches:
      - immowelt_location_code: AD08DE6325
        max_price: 800000
        min_sqm: 100
        max_pages: 2

  rss:
    enabled: false
    searches:
      - feeds:
          # Paste your Immoscout Sparalarm RSS URL here after enabling RSS export in your saved search
          - url: https://www.immobilienscout24.de/Suche/Rss?searchID=PASTE_ID_HERE
            label: is24_sparalarm
